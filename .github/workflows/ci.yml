name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lane-events:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/dori-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bun test test/lane-events.test.ts test/guest-conversations.test.ts test/native-interactions.test.ts
